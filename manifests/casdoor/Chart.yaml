apiVersion: v2
name: casdoor
description: An open-source Agent-first Identity and Access Management (IAM) /LLM MCP & agent gateway and auth server with web UI supporting OpenClaw, MCP, OAuth, OIDC, SAML, CAS, LDAP, SCIM, WebAuthn, TOTP, MFA, Face ID, Google Workspace, Azure AD
type: application
# version and appVersion are set from the release tag by the Docker Release job
version: 0.0.0
appVersion: 0.0.0
home: https://casdoor.ai
icon: https://cdn.casdoor.com/static/favicon.png
keywords:
  - casdoor
  - iam
  - sso
  - oauth
  - oidc
  - saml
  - ldap
  - authentication
sources:
  - https://github.com/casdoor/casdoor
maintainers:
  - name: Casdoor
    email: admin@casdoor.org
    url: https://casdoor.ai
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://casdoor.ai/docs/basic/try-with-helm
    - name: Demo
      url: https://door.casdoor.com
