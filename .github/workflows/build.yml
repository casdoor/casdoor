name: Build

env:
  GO_VERSION: "1.25.8"

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

jobs:
  go-tests:
    name: Running Go tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: casdoor
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      - name: Tests
        run: |
          go test -v $(go list ./...) -tags skipCi
        working-directory: ./

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: ./web/yarn.lock
      - run: yarn install
        working-directory: ./web
      - run: yarn typecheck && yarn lint
        working-directory: ./web
      - run: CI=false yarn run build
        working-directory: ./web
      - name: Upload build artifacts
        if: github.repository == 'casdoor/casdoor' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      - run: go version
      - name: Build
        run: |
          go build -race -ldflags "-extldflags '-static'"
        working-directory: ./

  linter:
    name: Go-Linter
    runs-on: ubuntu-latest
    needs: [go-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Sync vendor tree
        run: go mod vendor

      # CI and local `make lint` both use the repo's gofumpt-only golangci-lint config.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4
          args: --config .golangci.yml ./...

  e2e:
    name: e2e-test
    runs-on: ubuntu-latest
    needs: [go-tests]
    # The suite is a few minutes' work. Anything near this is hung, not slow,
    # and is worth failing rather than leaving to sit for the six-hour default.
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: casdoor
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod
      # Started before the front-end steps so the backend compiles while yarn
      # installs; it is waited on further down, once it is needed.
      - name: start backend
        run: nohup go run ./main.go > /tmp/backend.log 2>&1 &
        working-directory: ./
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: ./web/yarn.lock
      # Restored before `yarn install`, whose Cypress postinstall is what fills
      # this directory.
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('web/yarn.lock') }}
      - run: yarn install
        working-directory: ./web
      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend server to start on port 8000..."
          for i in {1..60}; do
            if curl -s http://localhost:8000 > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start within 60 seconds"
              echo "Backend logs:"
              cat /tmp/backend.log || echo "No backend logs available"
              exit 1
            fi
            echo "Waiting... ($i/60)"
            sleep 1
          done
      - uses: cypress-io/github-action@v5
        with:
          browser: chrome
          # `yarn install` above already installed everything, Cypress included.
          install: false
          start: yarn start
          wait-on: "http://localhost:7001"
          wait-on-timeout: 210
          working-directory: ./web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ./web/cypress/screenshots

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Releases are cut by hand: push a `vX.Y.Z` tag and this job publishes it.
    if: github.repository == 'casdoor/casdoor' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, linter, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./go.mod

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_id }}
          path: ./web/build

      - name: Prepare Go caches
        run: |
          echo "GOMODCACHE=$RUNNER_TEMP/gomod" >> $GITHUB_ENV
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> $GITHUB_ENV
          go clean -cache -modcache -testcache -fuzzcache

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository == 'casdoor/casdoor' && startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend, linter, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # The image build stamps the version by walking the git history, so it
          # needs the full history and the tags, not the default shallow clone.
          fetch-depth: 0

      # Registry versions keep the historical, un-prefixed form: tag `v1.2.3`
      # publishes `1.2.3`. `latest` is skipped for pre-release tags such as
      # `v1.2.3-beta.1`.
      - name: Resolve the released version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> $GITHUB_OUTPUT
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            casbin/casdoor:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'casbin/casdoor:latest' || '' }}

      - name: Push All In One Version to Docker Hub
        uses: docker/build-push-action@v3
        with:
          context: .
          target: ALLINONE
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            casbin/casdoor-all-in-one:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && 'casbin/casdoor-all-in-one:latest' || '' }}

      - name: Package and push Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REGISTRY=oci://registry-1.docker.io/casbin

          helm package manifests/casdoor --version "$VERSION" --app-version "$VERSION"
          helm push casdoor-helm-charts-$VERSION.tgz $REGISTRY
