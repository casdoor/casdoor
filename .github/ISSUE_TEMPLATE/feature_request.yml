name: Feature request
description: Suggest a new feature or an improvement for Casdoor
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Please write in English**, so that every maintainer and user can follow the issue.

        Search the [existing issues](https://github.com/casdoor/casdoor/issues) and the [documentation](https://casdoor.ai/docs) first, the feature may already exist or be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why Casdoor does not support it today
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work, e.g. new settings, API fields or UI changes
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or how other identity providers handle it
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to specifications (OAuth, OIDC, SAML, ...), screenshots or anything else that helps
