version: "2"
run:
  relative-path-mode: gomod
  modules-download-mode: vendor
linters:
  default: none
  enable:
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use the logs package from github.com/beego/beego/v2/core/logs
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (_test\.go|i18n/generate\.go|deployment/deploy\.go)
        linters:
          - forbidigo
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
